description = "Parse and explain query execution plans to identify performance bottlenecks"
prompt = "Parse and explain the provided query execution plan to identify performance bottlenecks. Analyze: 1) Plan Structure - Scan Types (Seq Scan, Index Scan, Index Only Scan, Bitmap Index Scan, Nested Loop, Hash Join, Merge Join) and when each is appropriate 2) Cost Analysis - Read cost numbers, row estimates, compare actual vs estimated cost, identify cost disproportional to row count 3) Performance Bottleneck Identification - High-cost operations (sequential scans on large tables, nested loop on large datasets, sort operations, hash aggregates, function calls in WHERE), missing indexes, inefficient joins, over-fetching data, temporary table usage 4) Specific Problem Patterns - N+1 query patterns, over-fetching data, missing indexes, suboptimal join order, row count accuracy issues 5) EXPLAIN ANALYZE Specific Analysis - Actual vs estimated timing, timing breakdown, row count accuracy. Provide structured analysis with step-by-step breakdown, identified issues, optimization recommendations with specific SQL fixes, index suggestions, and query rewrite options."
