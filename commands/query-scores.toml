description = "Evaluate and score database queries on optimization and best practices"
prompt = "Evaluate and score the provided database query on these dimensions (0-10 each): 1) Join Usage (20%) - optimal join types, minimal joins, correct join order 2) Data Selection Efficiency (20%) - only required columns, proper pagination/limits 3) WHERE Clause Optimization (15%) - sargable conditions, proper indexing support 4) N+1 Query Detection (15%) - no loops executing queries, proper data fetching 5) Index Utilization (15%) - optimal index usage, covering indexes 6) Query Structure & Readability (10%) - well-formatted, commented, follows conventions 7) Performance Considerations (5%) - caching opportunities, result set size. Provide scorecard format with overall score, dimension scores, strengths, issues, and specific actionable recommendations with priority."
