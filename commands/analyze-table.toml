description = "Perform deep analysis of a specific database table structure and usage patterns"
prompt = "Perform deep analysis of the provided database table. Cover: 1) Structure Overview - table name/purpose, row count/size, storage engine, current indexes 2) Column Analysis - data type appropriateness, NULL vs NOT NULL usage, default values, column cardinality, data distribution patterns 3) Relationship Analysis - foreign key relationships, referenced by (other tables referencing this table), referential integrity issues, relationship cardinality, missing relationships 4) Usage Pattern Analysis - most frequent queries, common WHERE clause patterns, typical JOIN operations, read vs write ratio, peak usage times 5) Performance Characteristics - query execution patterns, index usage statistics, full table scan frequency, temporary table usage, lock contention 6) Optimization Opportunities - missing indexes, redundant indexes, composite index opportunities, partial index potential, column data type optimization, normalization/denormalization opportunities, partitioning potential, archive strategy 7) Data Quality Assessment - duplicate records, NULL value patterns, data consistency issues, constraint violations, orphaned records 8) Security Considerations - sensitive data identification, access control requirements, audit trail needs, encryption requirements, compliance considerations. Provide structured analysis format with prioritized recommendations."
