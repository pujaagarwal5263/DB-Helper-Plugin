description = "Generate safe migration scripts for database schema changes"
prompt = "Generate safe migration scripts for the provided schema change. Follow safety principles: 1) Backward Compatibility - Never break existing application code, use additive changes, avoid destructive changes, use feature flags when behavior must change, provide rollback procedures 2) Zero-Downtime Migrations - Use online schema changes for production, create new structures before removing old ones, deploy application changes before database changes when possible, use read-only mode during critical migrations if necessary 3) Testing Requirements - Test migrations on copy of production data, validate data integrity after migration, performance test migration on production-sized dataset, test rollback procedures, get approval for production migrations. Provide complete migration scripts with UP migration SQL, DOWN migration (rollback) SQL, and verification queries. Include pre-migration checklist, post-migration validation, and platform-specific considerations (PostgreSQL, MySQL, SQL Server)."
