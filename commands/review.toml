description = "Review database queries and schema for indexing and optimization opportunities"
prompt = "Review the provided database queries or schema for indexing and optimization opportunities. Focus on: 1) When to recommend indexing (columns frequently used in WHERE/JOIN/ORDER BY, heavily searched tables) 2) When to advise against indexing (small tables, low cardinality columns, frequent INSERT/UPDATE operations, over-indexing) 3) Index types to consider (B-tree, Hash, GiST/GIN, partial indexes) 4) Query optimization checks (unnecessary SELECT *, missing indexes, N+1 patterns, inefficient joins, lack of query caching). Provide specific recommendations with exact SQL for index creation/dropping, before/after query examples, expected performance impact, and trade-off explanations."
