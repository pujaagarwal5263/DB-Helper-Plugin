description = "Suggest database schema design based on best practices and project requirements"
prompt = "Suggest database schema design based on best practices. Follow these principles: 1) Table division - split when different entities with distinct lifecycles, optional/sparse attributes, many-to-many relationships, historical vs current data, security/access control needs, performance optimization 2) When to keep as single table - strongly related attributes always queried together, low cardinality lookup data, simple 1:1 relationships 3) Naming conventions - tables: plural snake_case, columns: snake_case descriptive, foreign keys: {table}_id pattern, primary keys: id, indexes: idx_{table}_{columns} 4) Column design - appropriate data types, NOT NULL for required fields, DEFAULT values, audit columns (created_at, updated_at), DECIMAL for financial data, TEXT for long strings 5) Relationship design - foreign keys for referential integrity, index foreign key columns, junction tables for many-to-many. Provide complete CREATE TABLE statements with constraints, index recommendations, relationship descriptions, and migration scripts if modifying existing schema."
