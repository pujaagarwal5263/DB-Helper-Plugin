description = "Universal principles for generating optimized database queries (automatically enforced)"
prompt = "When generating database queries, ALWAYS follow these IMMUTABLE PRINCIPLES: 1) Column Selection - NEVER use SELECT *, always specify exact columns needed, only select columns used in application, use table aliases for clarity, avoid redundant data from joins 2) Join Optimization - Use INNER JOIN when relationship required, LEFT JOIN only when outer rows must be preserved, join tables in order of selectivity (most restrictive first), use explicit JOIN syntax never implicit WHERE clause joins, consider subqueries vs JOINs based on data size 3) WHERE Clause Requirements - Always include WHERE clauses for filtering, use sargable predicates (avoid functions on indexed columns), place most selective conditions first, use IN instead of OR for multiple values, avoid leading wildcards in LIKE, use parameterized queries 4) Result Set Management - Always include LIMIT for large result sets, use OFFSET/LIMIT or cursor-based pagination, consider COUNT queries separately for pagination metadata, default to reasonable LIMIT (e.g., 100) 5) Index Awareness - Write queries that can utilize existing indexes, order WHERE conditions to match index composition, consider covering indexes, avoid operations preventing index usage 6) N+1 Prevention - Never generate queries requiring loops to fetch related data, use JOINs or IN clauses, use eager loading patterns in ORMs, batch single-row queries 7) Query Readability - Use consistent formatting and indentation, employ CTEs for complex logic, add comments for non-obvious business logic, use meaningful aliases. Follow framework-specific guidelines for Raw SQL, ORM, and Query Builders."
